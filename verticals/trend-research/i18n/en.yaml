  alertTags: Alert tags

businessCase:
  errors:
    invalidRequest: The business case request is not valid. Check that Status is Submitted, every required field is filled in, Version is a positive whole number, and ReviewerEmail and AudienceKey are approved values.
    claimFailed: "The business case request could not be claimed for generation. If its Status shows Generating, set it back to Submitted to retry."
    invalidInputIds: InputPublicationIds must hold 1 to 5 distinct positive whole-number IDs separated by commas.
    invalidDigests: An input publication does not exist, is not a digest, belongs to another product, or has no report URL.
    digestContent: An input digest file could not be read, is not an HTML or text file, is empty, or the digests together exceed the maximum input size (tr_BusinessCaseMaxInputChars).
    invalidCase: The generated business case was rejected twice. A required section was empty, a citation did not match an input digest, or costs were not reported as Unknown without financial inputs.
    recheckFailed: "The business case request could not be re-checked before writing the draft. No draft was written. The request stays in Generating; set it back to Submitted to retry."
    storageFailed: The business case draft or its Publication record could not be written.
    validateFailed: "The business case request could not be validated. Fix the cause, then set Status back to Submitted to retry. Failed step:"
    generateFailed: "The business case could not be generated or stored; nothing was published. Fix the cause, then set Status back to Submitted to retry. Failed step:"
    reviewPublishFailed: "The business case review or publication failed. The draft, its Publication record and any copied file are kept; to retry, increase Version and set Status back to Submitted. Failed step:"
    afterApprovalFailed: "The business case was approved and published, but a later step failed. Failed step:"
    editedAfterApproval: "The draft was edited after the approval request, so it was not published. To resubmit, increase Version and set Status back to Submitted."
    approvalTimedOut: "The approval request had no response within 14 days. The draft was not published. To resubmit, increase Version and set Status back to Submitted."
  outputLanguage: English
  publicationTitle: Business case
  approvalTitle: Review business case request
  approvalDetails: "Review the restricted draft below. Approve only if its citations and assumptions are correct. Any change to the file after this request blocks publication: reject it and resubmit instead."
  notifyMessage: Approved business case
  html:
    title: Business case
    draftNotice: Draft for review. Not approved and not for distribution.
    request: Request
    requestId: Request ID
    version: Version
    product: Product
    decisionQuestion: Decision question
    geographies: Geographies
    timeHorizon: Time horizon
    alternatives: Alternatives
    strategicObjectives: Strategic objectives
    financialInputs: Financial inputs
    constraints: Constraints
    inputDigests: Input digests
    citations: Citations
    digestCitation: Digest
    sourceCitation: Original source
  sections:
    Decision: Decision
    Context: Context
    Alternatives: Alternatives
    StrategicFit: Strategic fit
    Evidence: Evidence
    ExpectedBenefits: Expected benefits
    CostsResources: Costs and resources
    Risks: Risks
    Assumptions: Assumptions
    Gaps: Gaps
    RecommendedNextStep: Recommended next step

