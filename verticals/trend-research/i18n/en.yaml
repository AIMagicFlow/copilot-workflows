solution:
  name: Trend Researcher
  description: >-
    Collects approved RSS sources, classifies new items against research briefs
    with a bounded AI prompt, and publishes a weekly digest to SharePoint.
publisher:
  name: Trend Research

flows:
  collectRss:
    name: TR Collect RSS
    description: Daily. Reads enabled RSS sources, saves new items as evidence and SourceItems (deduplicated by ItemKey).
  classifyItems:
    name: TR Classify Items
    description: Daily. Classifies Ready SourceItems against every enabled research brief and writes Signals.
  weeklyDigest:
    name: TR Weekly Digest
    description: Weekly. Builds one HTML digest per enabled brief from Digest signals and records the Publication.
  processDocuments:
    name: TR Process Documents
    description: Every 5 minutes. Reads text files uploaded under SourceUploads/PublicData, saves them as evidence and SourceItems (deduplicated by file ID). Other file types are recorded as metadata only.

connections:
  sharepoint:
    name: Trend Researcher - SharePoint
    description: Account with read/write access to the Trend Research SharePoint site.
  rss:
    name: Trend Researcher - RSS
    description: RSS connector used to read approved feeds.
  teams:
    name: Trend Researcher - Teams
    description: Teams account that receives the digest-ready notification.
  agent:
    name: Trend Researcher - AI classifier
    description: Copilot Studio agent connection used by the bounded classification prompt.

env:
  tr_SiteURL:
    name: Site URL
    description: Full URL of the Trend Research SharePoint site, e.g. https://contoso.sharepoint.com/sites/TrendResearch
  tr_ResearchBriefsList:
    name: Research Briefs list
    description: Title or ID (GUID) of the research briefs list.
  tr_SourcesList:
    name: Sources list
    description: Title or ID (GUID) of the sources list.
  tr_SourceItemsList:
    name: Source Items list
    description: Title or ID (GUID) of the source items list.
  tr_SignalsList:
    name: Signals list
    description: Title or ID (GUID) of the signals list.
  tr_PublicationsList:
    name: Publications list
    description: Title or ID (GUID) of the publications list.
  tr_BusinessCaseRequestsList:
    name: Business Case Requests list
    description: Title or ID (GUID) of the business case requests list.
  tr_DailyClassificationLimit:
    name: Daily Classification Limit
    description: Maximum SourceItems classified per daily run (each item is classified once per enabled brief).
  tr_DailyResearchLimit:
    name: Daily Research Limit
    description: Reserved for deep-research jobs. Not used by the current flows.
  tr_NotificationAudience:
    name: Notification Audience
    description: Reserved for audience-based delivery. Not used by the current flows.
  tr_SourceUploadsLibrary:
    name: Source Uploads library
    description: Title or ID (GUID) of the document library that receives uploaded sources. If the trigger rejects the title, enter the library GUID.
  tr_MaxUploadBytes:
    name: Maximum upload size (bytes)
    description: Uploaded files larger than this are recorded as metadata only and their content is not read.
  tr_PublishingEnabled:
    name: Publishing Enabled
    description: Reserved publication switch. Not used by the current flows.

digest:
  title: Trend Research Weekly Digest
  briefHeading: Research brief
  reportingWindow: Reporting window
  through: through
  pipelineSummary: Weekly pipeline summary
  digestSignalsIncluded: Digest signals included
  topFindings: Top findings
  relevance: Relevance
  impact: Impact
  horizon: Horizon
  published: Published
  evidence: Evidence
  notes: Notes
  openSource: Open original source
  footer: >-
    Generated automatically by Trend Researcher from classified signals.
    Review the Trend Research SharePoint workspace to inspect signals,
    sources, evidence, and previous reports.
  publicationTitle: Weekly Digest
  teamsMessage: Trend Researcher digest ready
  product: Product
  dimension: Dimension
  question: Research question
  noFindings: No findings for this objective in the reporting window.
  alertTags: Alert tags

codes:
  dimension: {Market: Market, Technology: Technology, Regulatory: Regulatory, Competition: Competition}
  objective: {Anticipate: Anticipate, MinimizeRisks: Minimize risks, Compare: Compare, Innovate: Innovate, Cooperate: Cooperate}
  alertTag: {CompetitorLaunch: Competitor launch, RegulatoryAlert: Regulatory alert, NewTechnology: New technology}
