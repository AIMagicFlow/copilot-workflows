seed:
  en:
  - Title: Real-Time Voice AI and Speech-to-Speech Models
    Question: What technical, product, ecosystem, safety, and adoption developments are changing real-time
      AI voice systems and native speech-to-speech models, particularly for enterprise customer service,
      contact centers, voice agents, and conversational applications?
    Keywords: speech-to-speech; speech to speech; speech2speech; S2S; real-time voice AI; realtime voice
      AI; real-time audio model; realtime audio model; voice-to-voice; native audio model; audio language
      model; multimodal audio; conversational speech model; streaming speech model; streaming inference;
      full-duplex voice; duplex conversation; voice agent; AI voice agent; conversational agent; spoken
      dialogue system; turn-taking; interruption handling; barge-in; endpointing; voice activity detection;
      VAD; latency; time to first audio; speech recognition; ASR; automatic speech recognition; speech
      synthesis; TTS; text-to-speech; neural codec; audio tokenizer; speech tokenizer; prosody; intonation;
      expressive speech; emotion-aware speech; multilingual speech; accent support; speaker diarization;
      echo cancellation; noise suppression; telephony AI; WebRTC; SIP; PSTN; contact center AI; CCaaS;
      customer service automation; voice cloning; speaker similarity; watermarking; audio provenance;
      deepfake detection; voice safety; consent; impersonation; model evaluation; speech benchmark; voice
      API; realtime API
    Exclusions: Music generation without a conversational speech capability; consumer voice changers with
      no model or platform significance; celebrity-voice entertainment; generic chatbot announcements
      with no audio or voice functionality; conventional IVR announcements with no AI model development;
      generic transcription products unless they materially affect a real-time voice pipeline; smart-speaker
      consumer news; audio hardware reviews; podcast promotion; cryptocurrency; gaming voice chat; articles
      that merely repeat another announcement without new technical, commercial, safety, or adoption evidence.
    Languages: English
    Geographies: Global; United States
    BriefVersion: '1'
    Enabled: '1'
    ReviewerEmail: alert+email@example.com
    DigestHumanReview: 'True'
  es:
  - Title: IA de voz en tiempo real y modelos speech-to-speech
    Question: ¿Qué desarrollos técnicos, de producto, de ecosistema, de seguridad y de adopción están
      cambiando los sistemas de voz con IA en tiempo real y los modelos nativos speech-to-speech, en especial
      para servicio al cliente, centros de contacto, agentes de voz y aplicaciones conversacionales empresariales?
    Keywords: speech-to-speech; S2S; voz en tiempo real; IA de voz; agente de voz; asistente de voz; real-time
      voice AI; voice agent; reconocimiento de voz; ASR; síntesis de voz; TTS; text-to-speech; latencia;
      turn-taking; barge-in; full-duplex; centro de contacto; contact center AI; CCaaS; atención al cliente;
      clonación de voz; voice cloning; deepfake de audio; marca de agua de audio; seguridad de voz; consentimiento;
      API de voz; realtime API
    Exclusions: Generación de música sin capacidad conversacional; cambiadores de voz para consumo sin
      relevancia de modelo o plataforma; entretenimiento con voces de celebridades; anuncios genéricos
      de chatbots sin funciones de audio o voz; IVR convencional sin desarrollo de modelos de IA; noticias
      de altavoces inteligentes; reseñas de hardware de audio; promoción de podcasts; criptomonedas; chat
      de voz en videojuegos; artículos que solo repiten otro anuncio sin evidencia técnica, comercial,
      de seguridad o de adopción nueva.
    Languages: Español; Inglés; Portugués
    Geographies: LATAM; Global
    BriefVersion: '1'
    Enabled: '1'
    ReviewerEmail: revisor@example.com
    DigestHumanReview: 'True'
