# SharePoint list schema: BusinessCaseRequests
# Internal names (name) are stable contracts used by the flows. Never rename them;
# change only display labels. New in 1.3.0.0, so fields carry no tenant-export ids.
list: BusinessCaseRequests
since: "1.3.0.0"
title:
  en: BusinessCaseRequests
  es: SolicitudesCasoNegocio
description:
  en: Analyst requests for a decision-ready business case built from selected digests.
  es: Solicitudes de analistas para un caso de negocio basado en resúmenes seleccionados.
fields:
- name: Title
  type: Text
  display:
    en: Title
    es: Título
  builtin: true
- name: Product
  type: Text
  required: true
  since: "1.3.0.0"
  display:
    en: Product
    es: Producto
- name: DecisionQuestion
  type: Note
  required: true
  since: "1.3.0.0"
  display:
    en: DecisionQuestion
    es: Pregunta de decisión
- name: Geographies
  type: Text
  required: true
  since: "1.3.0.0"
  display:
    en: Geographies
    es: Geografías
- name: TimeHorizon
  type: Text
  required: true
  since: "1.3.0.0"
  display:
    en: TimeHorizon
    es: Horizonte temporal
- name: Alternatives
  type: Note
  required: true
  since: "1.3.0.0"
  display:
    en: Alternatives
    es: Alternativas
- name: StrategicObjectives
  type: Note
  required: true
  since: "1.3.0.0"
  display:
    en: StrategicObjectives
    es: Objetivos estratégicos
- name: FinancialInputs
  type: Note
  since: "1.3.0.0"
  display:
    en: FinancialInputs
    es: Datos financieros
- name: Constraints
  type: Note
  since: "1.3.0.0"
  display:
    en: Constraints
    es: Restricciones
- name: InputPublicationIds
  type: Text
  required: true
  since: "1.3.0.0"
  display:
    en: InputPublicationIds
    es: IDs de publicaciones de entrada
- name: ReviewerEmail
  type: Text
  required: true
  since: "1.3.0.0"
  display:
    en: ReviewerEmail
    es: Correo del revisor
- name: AudienceKey
  type: Text
  required: true
  since: "1.3.0.0"
  display:
    en: AudienceKey
    es: Clave de audiencia
- name: PreviousRequestId
  type: Number
  since: "1.3.0.0"
  display:
    en: PreviousRequestId
    es: ID de solicitud previa
- name: Version
  type: Number
  default: 1
  required: true
  since: "1.3.0.0"
  display:
    en: Version
    es: Versión
- name: Status
  type: Choice
  choices: [Draft, Submitted, Generating, InReview, Approved, Rejected, Failed]
  default: Draft
  since: "1.3.0.0"
  display:
    en: Status
    es: Estado
- name: PublicationId
  type: Number
  since: "1.3.0.0"
  display:
    en: PublicationId
    es: ID de publicación
- name: LastError
  type: Note
  since: "1.3.0.0"
  display:
    en: LastError
    es: Último error
