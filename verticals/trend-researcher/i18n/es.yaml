solution:
  name: Vigilante de Tendencias
  description: >-
    Recolecta fuentes RSS aprobadas, clasifica los elementos nuevos frente a los
    briefs de investigación con un prompt de IA acotado y publica un resumen
    semanal en SharePoint.
publisher:
  name: Investigación de Tendencias

flows:
  collectRss:
    name: VT Recolectar RSS
    description: Diario. Lee las fuentes RSS habilitadas y guarda los elementos nuevos como evidencia y ElementosFuente (sin duplicados por clave).
  classifyItems:
    name: VT Clasificar Elementos
    description: Diario. Clasifica los ElementosFuente listos frente a cada brief habilitado y escribe Señales.
  weeklyDigest:
    name: VT Resumen Semanal
    description: Semanal. Genera un resumen HTML por brief habilitado a partir de las señales de resumen y registra la Publicación.
  processDocuments:
    name: VT Procesar Documentos
    description: Cada 5 minutos. Lee los archivos de texto cargados en SourceUploads/PublicData, los guarda como evidencia y SourceItems (sin duplicados por ID de archivo). Los demás tipos se registran solo con metadatos.
  businessCase:
    name: VT Caso de Negocio
    description: Cada 5 minutos. Toma las solicitudes de caso de negocio en estado Submitted, valida la solicitud y sus 1 a 5 resúmenes de entrada, y la reserva para su generación.
  cleanupSignals:
    name: VT Limpiar Señales
    description: Mensual. Elimina las señales Rejected y Monitor más antiguas que tr_RetentionDays y el archivo de evidencia de un elemento fuente cuando ya no le queda ninguna señal. Las filas de SourceItems se conservan y se marcan como Purged.
  refreshStats:
    name: VT Actualizar Estadísticas
    description: Diario. Cuenta las señales de los últimos 30 días por estado, franja de relevancia y etiqueta de alerta, y escribe los totales en la lista de estadísticas para ajustar el clasificador.

connections:
  sharepoint:
    name: Vigilante de Tendencias - SharePoint
    description: Cuenta con lectura y escritura en el sitio de SharePoint del Vigilante de Tendencias.
  rss:
    name: Vigilante de Tendencias - RSS
    description: Conector RSS para leer los feeds aprobados.
  teams:
    name: Vigilante de Tendencias - Teams
    description: Cuenta de Teams que recibe el aviso de resumen listo.
  agent:
    name: Vigilante de Tendencias - Clasificador IA
    description: Conexión del agente de Copilot Studio que usa el prompt de clasificación acotado.
  approvals:
    name: Vigilante de Tendencias - Aprobaciones
    description: Conexión de Aprobaciones que envía los borradores de casos de negocio al revisor configurado.

env:
  tr_SiteURL:
    name: URL del sitio
    description: URL completa del sitio de SharePoint, p. ej. https://contoso.sharepoint.com/sites/VigilanteTendencias
  tr_ResearchBriefsList:
    name: Lista de briefs
    description: Título o ID (GUID) de la lista de briefs de investigación.
  tr_SourcesList:
    name: Lista de fuentes
    description: Título o ID (GUID) de la lista de fuentes.
  tr_SourceItemsList:
    name: Lista de elementos fuente
    description: Título o ID (GUID) de la lista de elementos fuente.
  tr_SignalsList:
    name: Lista de señales
    description: Título o ID (GUID) de la lista de señales.
  tr_PublicationsList:
    name: Lista de publicaciones
    description: Título o ID (GUID) de la lista de publicaciones.
  tr_BusinessCaseRequestsList:
    name: Lista de solicitudes de caso de negocio
    description: Título de la lista de solicitudes de caso de negocio. Use el título, no el GUID; el paso de reserva llama a la API REST de SharePoint por título de lista.
  tr_StatsList:
    name: Lista de estadísticas
    description: Título o ID (GUID) de la lista de estadísticas.
  tr_ApprovedReviewers:
    name: Revisores aprobados
    description: Correos electrónicos separados por punto y coma permitidos como ReviewerEmail en una solicitud de caso de negocio. Si está vacío, no se acepta ninguna solicitud.
  tr_ApprovedAudiences:
    name: Audiencias aprobadas
    description: Claves de audiencia separadas por punto y coma permitidas como AudienceKey en una solicitud de caso de negocio. Si está vacío, no se acepta ninguna solicitud.
  tr_DailyClassificationLimit:
    name: Límite diario de clasificación
    description: Máximo de ElementosFuente clasificados por ejecución diaria (cada elemento se clasifica una vez por brief habilitado).
  tr_DailyResearchLimit:
    name: Límite diario de investigación
    description: Reservado para investigaciones profundas. No lo usan los flujos actuales.
  tr_NotificationAudience:
    name: Audiencia de notificación
    description: "Canal de Teams que recibe los enlaces de casos de negocio aprobados, como teamId|channelId. Déjelo vacío para enviarlos al propietario del flujo."
  tr_SourceUploadsLibrary:
    name: Biblioteca de cargas de fuentes
    description: Título o ID (GUID) de la biblioteca de documentos que recibe las fuentes cargadas. Si el desencadenador rechaza el título, escriba el GUID de la biblioteca.
  tr_RetentionDays:
    name: Retención de señales (días)
    description: Las señales Rejected y Monitor más antiguas que este número de días se eliminan el día 1 de cada mes, junto con su archivo de evidencia cuando ninguna otra señal lo usa. 0 desactiva la limpieza.
  tr_RejectBelow:
    name: Rechazar por debajo de relevancia
    description: Las señales con relevancia inferior a este valor reciben el estado Rejected. Se aplica a los elementos clasificados después del cambio; las señales existentes conservan su estado.
  tr_DigestFrom:
    name: Resumen desde relevancia
    description: Las señales con relevancia igual o superior a este valor reciben el estado Digest; los valores entre los dos umbrales reciben Monitor. Manténgalo por encima de tr_RejectBelow o ninguna señal recibirá Monitor.
  tr_MaxUploadBytes:
    name: Tamaño máximo de carga (bytes)
    description: Los archivos cargados que superen este tamaño se registran solo con metadatos y no se lee su contenido.
  tr_BusinessCaseMaxInputChars:
    name: Entrada máxima del caso de negocio (caracteres)
    description: Máximo de caracteres de texto de resúmenes que se envían a la IA para un caso de negocio, sumando todos los resúmenes de entrada. Una solicitud que supere el límite pasa a Failed antes de llamar a la IA.
  tr_PublishingEnabled:
    name: Publicación habilitada
    description: Interruptor de publicación reservado. No lo usan los flujos actuales.

