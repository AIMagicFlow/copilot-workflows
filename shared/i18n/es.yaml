# Cadenas compartidas por todas las verticales. Los archivos de cada vertical sobrescriben claves iguales.
language:
  name: Español
codes:
  impact: {High: Alto, Medium: Medio, Low: Bajo}
  horizon: {Near: Corto plazo, Medium: Mediano plazo, Long: Largo plazo}
classifier:
  outputLanguage: Spanish (español neutro latinoamericano)
sharepoint:
  allItemsView: Todos los elementos
provision:
  synopsis: Crea o actualiza las listas y bibliotecas de SharePoint de esta solución y verifica cada columna.
  description: >-
    Aplica sharepoint-template.pnp.xml con PnP PowerShell. La plantilla fija el nombre interno de cada
    columna, así los flujos funcionan en cualquier tenant. Se puede ejecutar de nuevo, por ejemplo después
    de una actualización, porque conserva las listas, columnas y filas existentes. Con -VerifyOnly solo
    revisa un sitio existente, por ejemplo uno cuyas listas se crearon desde los archivos CSV.
  paramSiteUrl: URL completa del sitio de SharePoint, por ejemplo https://contoso.sharepoint.com/sites/VigilanteTendencias
  paramClientId: ID de aplicación (cliente) de la app de Entra ID registrada para PnP PowerShell.
  paramVerifyOnly: Solo revisa el sitio, no cambia nada.
  missingModule: PnP.PowerShell no está instalado. Ejecute - Install-Module PnP.PowerShell -Scope CurrentUser
  applying: Aplicando la plantilla de SharePoint...
  verifying: Verificando listas, bibliotecas y columnas...
  missingLibrary: no se encontró la biblioteca
  missingFolder: carpeta no encontrada
  missingList: no se encontró la lista
  missingColumn: no se encontró la columna
  foundAs: existe una columna con este nombre pero su nombre interno es
  wrongType: tipo de columna incorrecto
  notUnique: debe exigir valores únicos
  failed: El sitio no coincide con el esquema esperado. Corrija los puntos anteriores antes de importar o ejecutar la solución.
  ok: Todas las listas, bibliotecas y columnas coinciden con el esquema esperado.
upgrade:
  title: "Notas de actualización de la versión {version}"
  intro: Esta versión agrega las listas y columnas siguientes. Si aprovisionó con PnP, vuelva a ejecutar pnp/provision.ps1 de este kit y no necesita nada más. Si creó las listas desde los archivos CSV, agréguelas a mano como se describe aquí.
  renameRule: Al crear cada columna, escriba primero el nombre interno, guárdela y solo después cambie el nombre al nombre para mostrar. SharePoint fija el nombre interno con el primer nombre que se escribe.
  newLibraries: "Bibliotecas nuevas (cree cada una a mano con este nombre de URL y luego agregue las carpetas):"
  folders: "carpetas"
  newLists: "Listas nuevas (cree cada una desde su archivo CSV en lists/):"
  col:
    list: Lista
    internalName: Nombre interno
    type: Tipo
    choices: Opciones
    displayName: Nombre para mostrar
