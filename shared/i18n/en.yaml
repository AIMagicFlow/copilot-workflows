# Strings shared by every vertical. Vertical files override keys with the same path.
language:
  name: English
codes:
  impact: {High: High, Medium: Medium, Low: Low}
  horizon: {Near: Near, Medium: Medium, Long: Long}
classifier:
  outputLanguage: English
sharepoint:
  allItemsView: All Items
provision:
  synopsis: Creates or updates the SharePoint lists and libraries of this solution, then verifies every column.
  description: >-
    Applies sharepoint-template.pnp.xml with PnP PowerShell. The template fixes each column internal name,
    so the flows work in any tenant. Safe to run again, for example after an upgrade, because existing
    lists, columns and rows are kept. With -VerifyOnly it only checks an existing site, for example one
    whose lists were created from the CSV files.
  paramSiteUrl: Full URL of the SharePoint site, for example https://contoso.sharepoint.com/sites/TrendResearch
  paramClientId: Application (client) ID of the Entra ID app registered for PnP PowerShell.
  paramVerifyOnly: Only check the site, change nothing.
  missingModule: PnP.PowerShell is not installed. Run - Install-Module PnP.PowerShell -Scope CurrentUser
  applying: Applying the SharePoint template...
  verifying: Verifying lists, libraries and columns...
  missingLibrary: library not found
  missingFolder: folder not found
  missingList: list not found
  missingColumn: column not found
  foundAs: a column with this name exists with internal name
  wrongType: wrong column type
  notUnique: must enforce unique values
  failed: The site does not match the expected schema. Fix the items above before importing or running the solution.
  ok: All lists, libraries and columns match the expected schema.
upgrade:
  title: "Upgrade notes for version {version}"
  intro: This release adds the lists and columns below. If you provisioned with PnP, re-run pnp/provision.ps1 from this kit and nothing else is needed. If you created the lists from the CSV files, add them by hand as described here.
  renameRule: Type the internal name first when you create each column, save it, and only then rename the column to the display name. SharePoint fixes the internal name from the first name you type.
  newLibraries: "New libraries (create each one by hand with this URL name, then add the folders):"
  folders: "folders"
  newLists: "New lists (create each one from its CSV file in lists/):"
  col:
    list: List
    internalName: Internal name
    type: Type
    choices: Choices
    displayName: Display name
