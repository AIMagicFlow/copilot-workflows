name: document-sanitizer

on:
  push:
    branches: [main]
    paths:
      - "addons/document-sanitizer/**"
      - "releases/addons/document-sanitizer/**"
      - ".github/workflows/document-sanitizer.yml"
  pull_request:
    paths:
      - "addons/document-sanitizer/**"
      - "releases/addons/document-sanitizer/**"
      - ".github/workflows/document-sanitizer.yml"

defaults:
  run:
    working-directory: addons/document-sanitizer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v

      - name: Parse deploy.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("deploy.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

      - name: Install Bicep through the Azure CLI
        run: az bicep install

      - name: Compile the template
        run: az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/azuredeploy.json"

      - name: Build the release twice and compare
        working-directory: .
        run: |
          python3 addons/document-sanitizer/package.py --out-root "$RUNNER_TEMP/a"
          python3 addons/document-sanitizer/package.py --out-root "$RUNNER_TEMP/b"
          diff -r "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"

      - name: Committed release matches a fresh build
        working-directory: .
        run: |
          version=$(tr -d '[:space:]' < addons/document-sanitizer/VERSION)
          committed="releases/addons/document-sanitizer/$version"
          if [ ! -d "$committed" ]; then
            echo "::notice::no committed release for $version yet"
            exit 0
          fi
          fresh="$RUNNER_TEMP/a/addons/document-sanitizer/$version"
          for name in $(ls "$committed"); do
            cmp "$committed/$name" "$fresh/$name" || { echo "::error::$name differs from a fresh build"; exit 1; }
          done
