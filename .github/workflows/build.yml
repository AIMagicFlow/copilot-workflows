name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pwsh --version   # preinstalled on ubuntu-latest; enables the provision.ps1 tests
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/build.py
      - name: Committed releases match the current source
        run: |
          for dir in releases/*/*/; do
            vertical=$(basename "$(dirname "$dir")"); version=$(basename "$dir")
            for zip in "$dir"*.zip; do
              cmp "$zip" "dist/$vertical/$version/$(basename "$zip")" 2>/dev/null \
                || echo "::notice::$zip differs from a fresh build (expected for older releases)"
            done
          done
